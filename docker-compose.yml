services:
  postgres:
    image: postgres:16
    container_name: kioske_postgres
    env_file:
      - .env.docker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/src/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kioske_net

  backend:
    build: ./backend
    container_name: kioske_backend
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      BACKEND_PORT: 3001
      HOST: 0.0.0.0
      CORS_ORIGIN: "*"
      FRONTEND_URL: http://localhost:3000
      API_URL: http://localhost:3001
      WS_URL: ws://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
    networks:
      - kioske_net

  frontend:
    build: ./frontend
    container_name: kioske_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
    networks:
      - kioske_net

volumes:
  pgdata:

networks:
  kioske_net:
    driver: bridge
